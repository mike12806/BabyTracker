name = "baby-tracker-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "baby.mfaherty.net/api/*", zone_name = "mfaherty.net" }
]

[[d1_databases]]
binding = "DB"
database_name = "baby-tracker-db"
database_id = "9b3d2ce1-e870-4ea3-97be-a51830e64662"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "baby-tracker-photos"

# Daily summary delivery. The cron enqueues one message per reader and the
# consumer renders and sends it, so a send that fails to SES is retried rather
# than logged and dropped — cron triggers do not re-run, so that used to lose
# the report for good.
#
# Both queues must exist before a deploy that declares these bindings; the
# deploy workflow creates them (idempotently) first.
[[queues.producers]]
queue = "baby-tracker-daily-summary"
binding = "EMAIL_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-daily-summary"
# One reader per message, so a batch is only ever a convenience.
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
# Five minutes between attempts: SES throttling and bad minutes recover on that
# scale, and nothing about a daily summary is latency-sensitive.
retry_delay = 300
dead_letter_queue = "baby-tracker-daily-summary-dlq"

# The dead letter queue has a consumer of its own, so a report that exhausted
# its retries is emailed to ALERT_EMAIL rather than sitting here unseen until
# its retention expires. No queue behind this one: a message that cannot be
# reported either is discarded after its retries, and the Worker log is the
# last word on it.
[[queues.consumers]]
queue = "baby-tracker-daily-summary-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 300

[triggers]
# Fires at 05:00 UTC daily = midnight Eastern Standard Time.
# During EDT (UTC-4) this fires at 1:00 AM ET — close enough for a daily summary.
crons = ["0 5 * * *"]

[vars]
CF_ACCESS_TEAM_DOMAIN = "mfaherty.cloudflareaccess.com"
CF_ACCESS_AUD = "5a28edb4368d3cfc1971089b60cc3a4444d93fd54d256e55bf9736fd6c8c4ad1"
AWS_SES_REGION = "us-east-1"

# For local dev, create server/.dev.vars to override:
#   CLIENT_URL=http://localhost:5173
# Secrets (never put in wrangler.toml — set via CLI):
#   wrangler secret put AWS_SES_ACCESS_KEY
#   wrangler secret put AWS_SES_SECRET_KEY
#   wrangler secret put REPORT_FROM_EMAIL
#   wrangler secret put ALERT_EMAIL       # optional — defaults to REPORT_FROM_EMAIL
