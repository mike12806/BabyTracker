name = "baby-tracker-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "baby.mfaherty.net/api/*", zone_name = "mfaherty.net" }
]

[[d1_databases]]
binding = "DB"
database_name = "baby-tracker-db"
database_id = "9b3d2ce1-e870-4ea3-97be-a51830e64662"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "baby-tracker-photos"

# Read-through cache, in front of D1 and the Cloudflare Access JWKS. See
# src/kv/cache.ts for the rule about what may live in it — briefly: only values
# that are derived from something else, and only where an answer up to a minute
# behind is still a correct answer. Entry data is never cached here, because
# two caregivers looking at the same child is exactly the case KV's eventual
# consistency would get wrong.
#
# The three things that qualify today were each paying a round trip they did
# not need to: the Access signing keys (a subrequest on *every* authenticated
# request, for a public document that rotates every few weeks), the caller's
# `users` row (an upsert plus a select before any route handler ran), and the
# per-child daily note and boop lines (written once a day and once a week
# respectively, read on every dashboard load).
#
# KV has no migrations of its own, so this repo brings its own runner —
# scripts/kv-migrate.mjs, run by deploy-server.yml after every deploy. See
# kv-migrations/README.md.
[[kv_namespaces]]
binding = "CACHE"
id = "a3182ee4f85146aca5e4aff361e0bf2e"

# Live updates — one Durable Object per child, holding the open WebSockets for
# every device currently looking at that child. See src/live.ts.
#
# A DO rather than a plain Worker because a Worker isolate cannot be addressed
# by a later request: the POST that logs a feed has no way to reach the socket
# some earlier isolate left open. `child:<id>` is a name both halves can derive
# from the child every write already names.
#
# Sockets are accepted with the hibernation API, so an idle household is
# evicted from memory and billed nothing for duration — the object only runs
# while it is actually fanning a change out. At this app's volume (a few
# devices, a few dozen entries a day) both requests and duration sit inside
# the Workers Paid included allowances.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "ChildLive"

# SQLite-backed, which is the default for new classes. The object stores
# nothing — the version of a child's data is whatever D1 says it is, and the
# only per-socket state is the connection id, which rides on the socket's own
# attachment and survives hibernation with it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChildLive"]

# Daily summary delivery. The cron enqueues one message per reader and the
# consumer renders and sends it, so a send that fails to SES is retried rather
# than logged and dropped — cron triggers do not re-run, so that used to lose
# the report for good.
#
# Both queues must exist before a deploy that declares these bindings; the
# deploy workflow creates them (idempotently) first.
[[queues.producers]]
queue = "baby-tracker-daily-summary"
binding = "EMAIL_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-daily-summary"
# One reader per message, so a batch is only ever a convenience.
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
# Five minutes between attempts: SES throttling and bad minutes recover on that
# scale, and nothing about a daily summary is latency-sensitive.
retry_delay = 300
dead_letter_queue = "baby-tracker-daily-summary-dlq"

# The dead letter queue has a consumer of its own, so a report that exhausted
# its retries is emailed to ALERT_EMAIL rather than sitting here unseen until
# its retention expires. No queue behind this one: a message that cannot be
# reported either is discarded after its retries, and the Worker log is the
# last word on it.
[[queues.consumers]]
queue = "baby-tracker-daily-summary-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 300

# Daily note generation. The cron writes each child's template note and
# enqueues the model call; the consumer replaces it with the AI version when
# one arrives. A cron trigger does not re-run, so without this a single
# transient model failure ("out of capacity" is a routine Workers AI answer)
# cost that child their real note for the whole day.
#
# No dead letter queue on purpose, unlike the summary email: a note that
# exhausts its retries has already left a correct fallback on the card and
# recorded source = 'fallback' in the row, so a queue of unread messages would
# add nothing the database does not already say.
[[queues.producers]]
queue = "baby-tracker-daily-note"
binding = "NOTE_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-daily-note"
# One child per message; a batch is only ever a convenience.
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
# A minute between attempts. Capacity blips clear on that scale, and the note
# only needs to land while it is still the morning it describes.
retry_delay = 60

# Boop line generation. The weekly cron enqueues one job per mood (day/night)
# and the consumer generates and stores that mood's new lines — same shape as
# the daily note queue above, so a transient Workers AI failure gets retried
# instead of costing that week's lines outright.
#
# No dead letter queue, also like the daily note: a mood that exhausts its
# retries just keeps whatever lines it already had, which is a fine outcome
# for something this low-stakes.
[[queues.producers]]
queue = "baby-tracker-boop-lines"
binding = "BOOP_LINES_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-boop-lines"
# Two jobs total (one per mood) — a batch is only ever a convenience.
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 300

# Diaper/feeding reminder pushes. The 5-minute cron below decides which
# (child, kind) gaps are overdue and enqueues one job per subscribed device;
# the consumer does the actual Web Push send, same split as the queues above
# so a push service hiccup gets retried instead of silently dropping that
# reminder.
#
# No dead letter queue: a reminder that exhausts its retries is exactly as
# low-stakes as a missed boop line — the next cron tick picks up the gap again
# if it's still open, and if a new entry was logged in the meantime there's
# nothing left to remind about.
[[queues.producers]]
queue = "baby-tracker-reminders"
binding = "REMINDER_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-reminders"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60

# Feeding-trend alert pushes. The 11am/4pm/7pm ET cron below works out whether
# a child is being fed less than they were by the same point on each of the
# previous seven days, asks Workers AI whether that's worth a notification, and
# enqueues one job per subscribed device; the consumer does the Web Push send.
#
# Only the *delivery* is queued, unlike the daily note — the analysis runs on
# the cron itself. This alert is about the day it is still in, so a retried
# model call is worth less than the template sentence it would have delayed;
# see the comment at the top of src/scheduled/feedingTrend.ts.
#
# No dead letter queue, same reasoning as the reminders queue above: an alert
# that exhausts its retries is superseded by the next checkpoint a few hours
# later, and by then the figures it was about have moved on anyway.
[[queues.producers]]
queue = "baby-tracker-feeding-trend"
binding = "FEEDING_TREND_QUEUE"

[[queues.consumers]]
queue = "baby-tracker-feeding-trend"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
retry_delay = 60

# Workers AI, for the dashboard's daily note. One generation per child per day
# from the cron below, cached in D1 — a page load never reaches the model, so
# the cost does not scale with how often the app is opened.
[ai]
binding = "AI"

[triggers]
# Five crons. The first two, both after midnight Eastern so each covers the
# prior full ET day, staggered so the note is written before the email that
# includes it:
#   05:00 UTC = 12:00 AM EST (1:00 AM EDT) — writes/queues the daily note.
#   05:15 UTC = 12:15 AM EST (1:15 AM EDT) — sends the summary email, 15
#   minutes later so the note queue has time to finish before it's read.
# The third tops up the boop-line pool (see scheduled/boopLines.ts) — weekly
# rather than daily, and off-hour and off the other two's minute so it never
# competes with them for the same invocation:
#   04:30 UTC on Sundays.
# The fourth checks for overdue diaper/feeding reminders (see
# scheduled/reminders.ts) — the only sub-daily cron here, because a 2h45m
# gap needs checking far more often than once a day:
#   every 5 minutes, all day.
# The fifth checks whether today's feeding is trending below the previous week
# (see scheduled/feedingTrend.ts) at 11am, 4pm and 7pm Eastern. Those are local
# times and cron is UTC, so it fires at six UTC hours — the EDT and the EST
# translation of each checkpoint — and the handler discards the three that
# don't land on an ET checkpoint hour. Three checks a day, year-round, with no
# DST drift; see FEEDING_TREND_CRON in src/index.ts for the full table:
#   15:00, 16:00, 20:00, 21:00, 23:00 and 00:00 UTC.
# `scheduled()` in src/index.ts tells the five apart by `event.cron`.
# Note: Cloudflare's weekday field is 1-7 (1 = Sunday), not the usual 0-6, so
# "SUN" is used here rather than a numeric day to avoid that ambiguity.
crons = ["0 5 * * *", "15 5 * * *", "30 4 * * SUN", "*/5 * * * *", "0 15,16,20,21,23,0 * * *"]

[vars]
CF_ACCESS_TEAM_DOMAIN = "mfaherty.cloudflareaccess.com"
CF_ACCESS_AUD = "5a28edb4368d3cfc1971089b60cc3a4444d93fd54d256e55bf9736fd6c8c4ad1"
AWS_SES_REGION = "us-east-1"
# Override to write the daily note with a different Workers AI model.
# Defaults to DEFAULT_NOTE_MODEL in src/scheduled/dailyNote.ts.
# DAILY_NOTE_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Override to write new boop lines with a different Workers AI model.
# Defaults to DEFAULT_BOOP_LINE_MODEL in src/scheduled/boopLines.ts.
# BOOP_LINES_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Override to analyse the feeding trend with a different Workers AI model.
# Defaults to DEFAULT_TREND_MODEL in src/scheduled/feedingTrend.ts. That prompt
# asks for a judgement and a JSON object rather than prose, so it is the one
# most likely to want a different model — hence the override.
# FEEDING_TREND_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# For local dev, create server/.dev.vars to override:
#   CLIENT_URL=http://localhost:5173
# Secrets (never put in wrangler.toml — set via CLI):
#   wrangler secret put AWS_SES_ACCESS_KEY
#   wrangler secret put AWS_SES_SECRET_KEY
#   wrangler secret put REPORT_FROM_EMAIL
#   wrangler secret put ALERT_EMAIL       # optional — defaults to REPORT_FROM_EMAIL
#
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT (Web Push, for the
# reminder cron) are also secrets rather than vars — even the "public" key,
# so the client never needs a rebuild to pick it up, it just fetches it over
# GET /api/push/vapid-public-key. They're set automatically by the deploy
# workflow (deploy-server.yml) the first time it runs, and never regenerated
# after that: rotating them would break every device that already subscribed.
