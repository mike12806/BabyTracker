name: "Vault: seed secrets"

# One-time copy of this repo's deploy secrets into Vault
# (kv/github/BabyTracker/cloudflare), after which the deploy workflows read them
# from Vault (role babytracker-deploy, gh_hdc vault/) and the GitHub repo secrets
# can be deleted. Each value is read back and compared by checksum; the log
# shows names and ok/MISMATCH only. Delete this workflow once it has run.

on:
  workflow_dispatch:

concurrency:
  group: vault-seed-secrets
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Tailscale + Vault logins through GitHub OIDC

env:
  VAULT_ADDR: https://vault.mfaherty.net

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # tag:ci-vault reaches only Vault and DNS (gh_hdc tailscale.json).
      - name: Connect to Tailscale (tag:ci-vault)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: T9GJo4CXk621CNTRL-kek3ub1Mdr11CNTRL
          audience: api.tailscale.com/T9GJo4CXk621CNTRL-kek3ub1Mdr11CNTRL
          tags: tag:ci-vault
          hostname: github-babytracker-vault-seed
          version: latest

      - name: Copy the secrets into Vault and check them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vault.mfaherty.net" | jq -r .value)
          token=$(jq -n --arg jwt "$jwt" '{role: "babytracker-seed", jwt: $jwt}' \
            | curl -fsS --data @- "$VAULT_ADDR/v1/auth/github-actions/login" | jq -r .auth.client_token)
          echo "::add-mask::${token}"
          trap 'curl -fsS -X POST -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null && echo revoked' EXIT
          path="kv/data/github/BabyTracker/cloudflare"
          names=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          jq -n '{data: ([$ARGS.positional[] as $k | {key: $k, value: (env[$k] // "")}] | map(select(.value != "")) | from_entries)}' --args "${names[@]}" \
            | curl -fsS -H "X-Vault-Token: ${token}" --data @- "$VAULT_ADDR/v1/${path}" >/dev/null
          stored=$(curl -fsS -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/${path}")
          problems=0
          for k in "${names[@]}"; do
            if [ -z "${!k:-}" ]; then echo "  ${k}: not set in GitHub, skipped"; problems=$((problems + 1)); continue; fi
            if [ "$(jq -r --arg k "$k" '.data.data[$k]' <<<"$stored" | sha256sum)" = "$(printf '%s\n' "${!k}" | sha256sum)" ]; then
              echo "  ${k}: ok"
            else
              echo "::error::${k}: MISMATCH"; problems=$((problems + 1))
            fi
          done
          [ "$problems" -eq 0 ]
